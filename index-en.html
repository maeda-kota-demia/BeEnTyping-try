<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="static/img/favicon.svg" id="favicon">
    <title>BeEnPazzleTyping</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <img src="static/img/background.svg" alt="背景" class="background-image">
    <!-- CPUとの対戦機能！ -->
    <script src="static/higgsino.min.js"></script>
    <header id="header">
        <div class="logo">
            <img src="static/img/logo_color.svg" alt=""><span class="logo-str">Typing Game</span>
        </div>
        <div class="genre-wrapper">
            <div class="genre-heading">
                <h3>レベルを選択しよう！</h3>
            </div>
            <div class="genre-options">
                <label class="genre_btn active-genre" >
                    <input name="genre" type="radio" value="jr-1">中学１年生レベル英単語</input>
                </label>
                <label class="genre_btn" >
                    <input name="genre" type="radio"  value="jr-2">中学２年生レベル英単語</input>
                </label>
                <label class="genre_btn" >
                    <input name="genre" type="radio"  value="jr-3">中学３年生レベル英単語</input>
                </label>
                <label class="genre_btn" >
                    <input name="genre" type="radio"  value="hi-1">高校１年生レベル英単語</input>
                </label>
                <label class="genre_btn" >
                    <input name="genre" type="radio"  value="hi-2">高校２年生レベル英単語</input>
                </label>
                <label class="genre_btn" >
                    <input name="genre" type="radio"  value="hi-3">高校３年生レベル英単語</input>
                </label>
                <input name="genre" id="genre" value="jr-1" type="hidden">
            </div>
        </div>
    </header>
    <div class="reload" onclick="location.reload()">やり直す</div>
    <div id="panel-container">
        <h2 id="word">スペースキーを入力してください！</h2>
        <!-- <div class="panel">Maeda Kota</div> -->
    </div>
    <div class="game">
        <h2 id="roma"><span id="typed" style="display:none;"></span><span id="untyped" style="display:none;"></span></h2>
        <div class="game__info">
            <h3>MISS : <span id="missMount">0</span></h3>
            <h3>TIME : <span id="timeText">00.000</span></h3>
            <h3>Word Count : <span id="WordCount">0</span><span>/20</span></h3>
        </div>
        <h3 id="otherresult"></h3>
        <h3 id="score"></h3>
    </div>
    <section id="result" style="display: none;">
        <div>Esc, Enterキーを押してもう一度！</div>
        <a href="#result" id="result__link" class="updown">
            <span>↓</span>
            <span>&nbsp;</span>
            <span>入力した単語をチェック！</span>
        </a>
        <h2>入力した単語</h2>
        <div id="result__table" class="result__table">
            <div>
                <p class="result__table__title">単語</p>
                <p class="result__table__title">意味など</p>
            </div>
        </div>
    </section>

    <section id="component">
        <audio id="type_clear">
            <source src="static/mp3/type_clear.mp3" type="audio/mp3">
        </audio>
        <audio id="type_miss">
            <source src="static/mp3/type_miss.mp3" type="audio/mp3">
        </audio>
        <audio id="count_down">
            <source src="static/mp3/countdown-1.mp3" type="audio/mp3">
        </audio>
        <audio id="start_sound">
            <source src="static/mp3/countdown-2.mp3" type="audio/mp3">
        </audio>
    </section>
    <script src="static/timeattack.js"></script>
</body>
</html>
